[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-data-pipeline"
version = "0.1.0"
description = "Ingest, validate, and export NPI Registry provider records."
requires-python = ">=3.11"

[project.scripts]
provider-pipeline = "provider_pipeline.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
